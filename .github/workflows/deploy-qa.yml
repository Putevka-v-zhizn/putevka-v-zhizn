name: Deploy QA

on:
  push:
    branches:
      - "**--qa"
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - stop
          - seed-test-users
          - seed-nto-demo
          - diagnose
      accounts_json:
        description: "QA accounts with username, program and password_hash; never plaintext passwords"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: qa-${{ github.event.inputs.action == 'diagnose' && 'diagnostics' || 'server-deploy' }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.inputs.action == 'deploy'
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tags
        id: image
        run: |
          set -euo pipefail

          image_name="$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          echo "sha_tag=$REGISTRY/$image_name:qa-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$REGISTRY/$image_name:qa-latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push QA image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.sha_tag }}
            ${{ steps.image.outputs.latest_tag }}

      - name: Ensure rsync is available
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rsync
          fi

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.QA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.QA_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.QA_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/qa_deploy_key
          chmod 600 ~/.ssh/qa_deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Ensure deploy directory exists
        env:
          DEPLOY_HOST: ${{ secrets.QA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.QA_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.QA_DEPLOY_PATH }}
        run: |
          set -euo pipefail

          test -n "$DEPLOY_PATH"

          ssh -i ~/.ssh/qa_deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/deploy/qa' '$DEPLOY_PATH/media' '$DEPLOY_PATH/staticfiles' '$DEPLOY_PATH/logs'"

      - name: Sync QA deploy files
        env:
          DEPLOY_HOST: ${{ secrets.QA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.QA_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.QA_DEPLOY_PATH }}
        run: |
          set -euo pipefail

          rsync -az \
            -e "ssh -i ~/.ssh/qa_deploy_key" \
            docker-compose.qa.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.qa.yml"
          rsync -az \
            -e "ssh -i ~/.ssh/qa_deploy_key" \
            deploy/qa/Caddyfile "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/qa/Caddyfile"

      - name: Upload QA environment file
        env:
          DEPLOY_HOST: ${{ secrets.QA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.QA_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.QA_DEPLOY_PATH }}
          DEPLOY_ENV_FILE: ${{ secrets.QA_DEPLOY_ENV_FILE }}
          DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
          QA_DOMAIN: ${{ secrets.QA_DOMAIN }}
          APP_IMAGE: ${{ steps.image.outputs.sha_tag }}
        run: |
          set -euo pipefail

          test -n "$DATABASE_URL"
          test -n "$QA_DOMAIN"
          test -n "$APP_IMAGE"

          {
            if [ -n "${DEPLOY_ENV_FILE:-}" ]; then
              printf '%s\n' "$DEPLOY_ENV_FILE"
            fi
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'QA_DOMAIN=%s\n' "$QA_DOMAIN"
            printf 'ALLOWED_HOSTS=%s\n' "$QA_DOMAIN"
            printf 'CSRF_TRUSTED_ORIGINS=https://%s\n' "$QA_DOMAIN"
            printf 'BASE_URL=https://%s\n' "$QA_DOMAIN"
            printf 'APP_IMAGE=%s\n' "$APP_IMAGE"
          } | ssh -i ~/.ssh/qa_deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "umask 077 && cat > '$DEPLOY_PATH/.env'"

      - name: Deploy QA stack
        env:
          DEPLOY_HOST: ${{ secrets.QA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.QA_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.QA_DEPLOY_PATH }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/qa_deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

          ssh -i ~/.ssh/qa_deploy_key "$DEPLOY_USER@$DEPLOY_HOST" <<EOF
          set -euo pipefail
          cd '$DEPLOY_PATH'
          echo "Deploying QA branch: $DEPLOY_BRANCH"
          docker compose --env-file .env -f docker-compose.qa.yml pull
          # Do not let the validation container consume the remaining SSH script.
          docker compose --env-file .env -f docker-compose.qa.yml run --rm --no-deps -T --interactive=false caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose --env-file .env -f docker-compose.qa.yml up -d --remove-orphans
          # rsync replaces the bind-mounted file; recreate to mount its new inode.
          docker compose --env-file .env -f docker-compose.qa.yml up -d --no-deps --force-recreate caddy
          docker compose --env-file .env -f docker-compose.qa.yml ps
          EOF

      - name: Check QA admin and static files over HTTPS
        timeout-minutes: 6
        env:
          QA_DOMAIN: ${{ secrets.QA_DOMAIN }}
        run: python deploy/qa/check_http.py "https://$QA_DOMAIN"

  stop:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'stop'
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.QA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.QA_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.QA_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/qa_deploy_key
          chmod 600 ~/.ssh/qa_deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Stop QA stack
        env:
          DEPLOY_HOST: ${{ secrets.QA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.QA_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.QA_DEPLOY_PATH }}
        run: |
          set -euo pipefail

          test -n "$DEPLOY_PATH"

          ssh -i ~/.ssh/qa_deploy_key "$DEPLOY_USER@$DEPLOY_HOST" <<EOF
          set -euo pipefail
          cd '$DEPLOY_PATH'
          docker compose --env-file .env -f docker-compose.qa.yml down --remove-orphans
          EOF

  seed-test-users:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'seed-test-users' || github.event.inputs.action == 'seed-nto-demo' || github.event.inputs.action == 'diagnose')
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - name: Configure QA SSH
        env:
          DEPLOY_HOST: ${{ secrets.QA_DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.QA_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/qa_deploy_key
          chmod 600 ~/.ssh/qa_deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Prepare QA test data
        env:
          DEPLOY_HOST: ${{ secrets.QA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.QA_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.QA_DEPLOY_PATH }}
          ACCOUNTS_JSON: ${{ inputs.accounts_json }}
          QA_ACTION: ${{ inputs.action }}
        run: |
          python - <<'PY'
          import json, os, pathlib, shlex, subprocess, sys
          connection = ['ssh', '-i', os.path.expanduser('~/.ssh/qa_deploy_key'), os.environ['DEPLOY_USER'] + '@' + os.environ['DEPLOY_HOST']]
          directory = 'cd ' + shlex.quote(os.environ['DEPLOY_PATH'])
          if os.environ['QA_ACTION'] == 'diagnose':
              subprocess.run(connection + [directory + ' && df -h && docker system df && docker ps --format "{{.Names}} {{.Image}}" && docker compose --env-file .env -f docker-compose.qa.yml ps && docker compose --env-file .env -f docker-compose.qa.yml logs --tail=80 web'], check=True)
              sys.exit(0)
          if os.environ['QA_ACTION'] == 'seed-nto-demo':
              script = 'SEED_QA_NTO = True\n' + pathlib.Path('deploy/qa/create_nto_demo.py').read_text()
          else:
              accounts = json.loads(os.environ['ACCOUNTS_JSON'])
              script = 'ACCOUNTS = ' + repr(accounts) + '\n'
              script += pathlib.Path('deploy/qa/create_test_users.py').read_text()
          remote = 'cd ' + shlex.quote(os.environ['DEPLOY_PATH'])
          remote += ' && docker compose --env-file .env -f docker-compose.qa.yml exec -T web python manage.py shell'
          subprocess.run(['ssh', '-i', os.path.expanduser('~/.ssh/qa_deploy_key'),
                          os.environ['DEPLOY_USER'] + '@' + os.environ['DEPLOY_HOST'], remote],
                         input=script, text=True, check=True)
          PY
