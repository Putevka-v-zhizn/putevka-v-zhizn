<form method="post" class="row g-3 border-bottom pb-3 mb-3">
  {% csrf_token %}
  <input type="hidden" name="form_type" value="save_decision">
  {% for field in form %}
    <div class="{% if field.name == 'comment' %}col-12{% else %}col-md-6{% endif %}">
      <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
    </div>
  {% endfor %}
  {% for error in form.non_field_errors %}<div class="col-12 text-danger small">{{ error }}</div>{% endfor %}
  <div class="col-12"><button class="btn btn-primary">Сохранить итог</button></div>
</form>
