<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ status }} — {{ title }} · Путёвка в жизнь</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #f5f7fb; color: #212529;
      font-family: system-ui, sans-serif; }
    main { width: 100%; max-width: 560px; padding: 40px 24px; text-align: center;
      background: white; border: 1px solid #dee2e6; border-radius: 16px; }
    .brand { color: #596573; margin: 0 0 24px; }
    .code { font-size: 64px; font-weight: 700; color: #0d6efd; margin: 0; }
    h1 { font-size: 26px; line-height: 1.3; }
    .message { color: #596573; line-height: 1.6; margin-bottom: 28px; }
    a { display: inline-block; padding: 12px 20px; border-radius: 8px;
      background: #0d6efd; color: white; text-decoration: none; }
    a:hover { background: #0b5ed7; }
    a:focus-visible { outline: 3px solid #212529; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Путёвка в жизнь</p>
    <p class="code">{{ status }}</p>
    <h1>{{ title }}</h1>
    <p class="message">{{ message }}</p>
    <a href="/">На главную</a>
  </main>
</body>
</html>
